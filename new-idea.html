<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IdeaVault-New Idea</title>
    <link rel="stylesheet" href="home-style.css">
</head>
<body>

    <div class="app">
        <nav class="sidebar">
            <h2>IdeaVault</h2>
            <a href="home.html">Home</a>
            <a href="new-idea.html">New Idea</a>
            <a href="history.html">History</a>
            <a href="profile.html">Profile</a>
            
            <button id="logoutBtn">Log out</button>
        </nav>

        <main>
            <h1>Whats on your mind?</h1>
            <textarea id="ideaInput" rows="6" style="width: 100%;" placeholder="Type your idea hear or hit the mic..."></textarea>
            <br><br>
            <button id="micBtn">🎤 Speak</button>
            <button id="judgeBtn"> Judge this idea.</button>
        </main>
<script>
    let mediaRecorder;
    let audioChunks = [];

    document.getElementById("micBtn").addEventListener("click", async () => {
        console.log("Mic button clicked!");   // <-- add this line here

        if (!mediaRecorder || mediaRecorder.state === "inactive") {
            // start recording
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];

            mediaRecorder.addEventListener("dataavailable", (event) => {
                audioChunks.push(event.data);
            });

            mediaRecorder.addEventListener("stop", async () => {
                const audioBlob = new Blob(audioChunks, { type: "audio/webm" });
                await transcribeAudio(audioBlob);
            });

            mediaRecorder.start();
            document.getElementById("micBtn").textContent = "⏹ Stop recording";
        } else {
            // stop recording
            mediaRecorder.stop();
            document.getElementById("micBtn").textContent = "🎤 Speak";
        }
    });
</script>
</body>
</html>
